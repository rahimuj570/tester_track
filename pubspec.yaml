name: tester_track
description: Lightweight Flutter tracker for Google Play 14-day closed testing. Monitor tester engagement, session duration, and daily activity via secondary Firebase.
version: 0.0.3
homepage: https://tester-track.pages.dev
repository: https://github.com/rahimuj570/tester_track
issue_tracker: https://github.com/rahimuj570/tester_track/issues

topics:
  - testing
  - google-play
  - analytics
  - monitoring
  - firebase

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  cloud_firestore_platform_interface: ^6.0.0
  shared_preferences: ^2.2.0
  device_info_plus: ^10.0.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^3.0.0
