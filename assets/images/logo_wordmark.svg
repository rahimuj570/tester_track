<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <linearGradient id="wmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="wmAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="wmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Group (scaled to 120x120 at offset 20, 20) -->
  <g transform="translate(20, 20)">
    <!-- Base Rounded Badge -->
    <rect width="120" height="120" rx="30" fill="url(#wmBgGrad)" stroke="#1E293B" stroke-width="2" />

    <!-- Outer Radar Orbit -->
    <circle cx="60" cy="60" r="45" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

    <!-- Active Radar Arc -->
    <path d="M 28 60 A 32 32 0 1 1 92 60" fill="none" stroke="url(#wmAccentGrad)" stroke-width="4" stroke-linecap="round" opacity="0.9" />

    <!-- Telemetry Target Circle -->
    <circle cx="60" cy="60" r="20" fill="none" stroke="url(#wmAccentGrad)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

    <!-- Stylized Monogram "T" -->
    <rect x="36" y="34" width="48" height="8" rx="4" fill="url(#wmAccentGrad)" filter="url(#wmGlow)" />
    <path d="M 56 42 L 64 42 L 64 56 L 56 56 Z" fill="url(#wmAccentGrad)" />

    <!-- Center Pulse Beacon -->
    <circle cx="60" cy="64" r="12" fill="#0B132B" stroke="url(#wmAccentGrad)" stroke-width="2.5" />
    <circle cx="60" cy="64" r="6" fill="url(#wmAccentGrad)" filter="url(#wmGlow)" />
    <circle cx="60" cy="64" r="2.5" fill="#FFFFFF" />

    <!-- Notches -->
    <line x1="60" y1="18" x2="60" y2="24" stroke="#00F5D4" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="60" y1="96" x2="60" y2="102" stroke="#00F5D4" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="18" y1="60" x2="24" y2="60" stroke="#00F5D4" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="96" y1="60" x2="102" y2="60" stroke="#00F5D4" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Wordmark Text -->
  <!-- "Tester" (White) + "Track" (Mint) -->
  <text x="160" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#F8FAFC">Tester</tspan><tspan fill="url(#wmAccentGrad)">Track</tspan>
  </text>

  <!-- Tagline: "Know who is actually testing." -->
  <text x="162" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
    Know who is actually testing.
  </text>
</svg>
