<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Gradient: Cyan to Mint to Emerald -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="sweepGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#1E293B" stroke-width="4" />

  <!-- Outer Telemetry Orbit Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#1E293B" stroke-width="4" stroke-dasharray="16 16" opacity="0.6" />

  <!-- Active Radar Arc -->
  <path d="M 120 256 A 136 136 0 1 1 392 256" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />

  <!-- Radar Sweep Sector -->
  <path d="M 256 256 L 392 256 A 136 136 0 0 0 256 120 Z" fill="url(#sweepGrad)" />

  <!-- Mid Telemetry Target Circle -->
  <circle cx="256" cy="256" r="88" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-dasharray="8 8" opacity="0.5" />

  <!-- Stylized Monogram "T" and Tracking Beacon -->
  <!-- Horizontal Top Crossbar -->
  <rect x="156" y="148" width="200" height="32" rx="16" fill="url(#accentGrad)" filter="url(#mintGlow)" />

  <!-- Vertical Stem -->
  <path d="M 240 176 L 272 176 L 272 240 L 240 240 Z" fill="url(#accentGrad)" />

  <!-- Central Target Ping Beacon -->
  <circle cx="256" cy="272" r="52" fill="#0B132B" stroke="url(#accentGrad)" stroke-width="8" />
  <circle cx="256" cy="272" r="28" fill="url(#accentGrad)" filter="url(#mintGlow)" />
  <circle cx="256" cy="272" r="10" fill="#FFFFFF" />

  <!-- Radar Telemetry Crosshairs -->
  <line x1="256" y1="80" x2="256" y2="116" stroke="#00F5D4" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <line x1="256" y1="396" x2="256" y2="432" stroke="#00F5D4" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <line x1="80" y1="256" x2="116" y2="256" stroke="#00F5D4" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <line x1="396" y1="256" x2="432" y2="256" stroke="#00F5D4" stroke-width="4" stroke-linecap="round" opacity="0.7" />
</svg>
